<svg viewBox="0 0 640 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A stuck payment flows through looking up the rulebook, figuring out why it's stuck, and checking it against rules and watch lists, then a decision is made to let it through, block it, or hand it to a human, all of which lead to a plain-English report being written.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C8E8C"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F6E5C"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="632" height="736" rx="18" fill="#F6F5F2" stroke="#E1DED6" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- Step 1 -->
    <rect x="180" y="24" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="320" y="58" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2A2E">A stuck payment</text>
    <line x1="320" y1="80" x2="320" y2="110" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="180" y="116" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="320" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2A2E">Look up the real rulebook</text>
    <line x1="320" y1="172" x2="320" y2="202" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="180" y="208" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="320" y="242" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2A2E">Figure out why it's stuck</text>
    <line x1="320" y1="264" x2="320" y2="294" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="180" y="300" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="320" y="334" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1B2A2E">Check the rules &amp; watch lists</text>
    <line x1="320" y1="356" x2="320" y2="384" stroke="#0F6E5C" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

    <!-- Decision diamond -->
    <polygon points="320,384 420,432 320,480 220,432" fill="#E3F1EC" stroke="#0F6E5C" stroke-width="1.8"/>
    <text x="320" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4438">Decide</text>

    <!-- Fan-out arrows -->
    <line x1="220" y1="432" x2="126" y2="556" stroke="#0F6E5C" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
    <line x1="320" y1="480" x2="320" y2="556" stroke="#0F6E5C" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
    <line x1="420" y1="432" x2="514" y2="556" stroke="#0F6E5C" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

    <!-- Outcome boxes -->
    <rect x="30" y="560" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="120" y="594" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1B2A2E">Let it through</text>

    <rect x="230" y="560" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="320" y="594" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1B2A2E">Block it</text>

    <rect x="430" y="560" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="520" y="594" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1B2A2E">Hand to a human</text>

    <!-- Converge arrows -->
    <line x1="120" y1="616" x2="245" y2="656" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="320" y1="616" x2="320" y2="656" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="520" y1="616" x2="395" y2="656" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Final box -->
    <rect x="170" y="660" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="320" y="694" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2A2E">Write a plain-English report</text>

  </g>
</svg>
