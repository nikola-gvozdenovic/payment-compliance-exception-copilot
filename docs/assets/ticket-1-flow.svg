<svg viewBox="0 0 920 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Made-up payment details are turned into a real-looking payment form, wrapped with a status and a short history, and saved as a reusable example.">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C8E8C"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="152" rx="18" fill="#F6F5F2" stroke="#E1DED6" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2A2E">
    <rect x="24" y="52" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="119" y="76" text-anchor="middle">Made-up payment</text>
    <text x="119" y="93" text-anchor="middle">details</text>

    <line x1="214" y1="80" x2="244" y2="80" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow3)"/>

    <rect x="244" y="52" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="339" y="76" text-anchor="middle">Turn it into a real</text>
    <text x="339" y="93" text-anchor="middle">payment form</text>

    <line x1="434" y1="80" x2="464" y2="80" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow3)"/>

    <rect x="464" y="52" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="559" y="76" text-anchor="middle">Add a status and</text>
    <text x="559" y="93" text-anchor="middle">short history</text>

    <line x1="654" y1="80" x2="684" y2="80" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow3)"/>

    <rect x="684" y="52" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="779" y="76" text-anchor="middle">Save as a reusable</text>
    <text x="779" y="93" text-anchor="middle">example</text>
  </g>
</svg>
