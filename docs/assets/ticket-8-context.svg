<svg viewBox="0 0 640 836" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The whole project's flow, greyed out, with one new step highlighted right after the stuck payment arrives: hiding names and account numbers, because TICKET-8 makes sure no AI step ever sees real personal details.">
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C7C4BA"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="632" height="828" rx="18" fill="#F6F5F2" stroke="#E1DED6" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- Already built by TICKET-1, not this task -->
    <rect x="180" y="24" width="280" height="56" rx="10" fill="#EDEDEA" stroke="#C7C4BA" stroke-width="1.4"/>
    <text x="320" y="58" text-anchor="middle" font-size="16" font-weight="600" fill="#9C9A90">A stuck payment</text>
    <line x1="320" y1="80" x2="320" y2="110" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>

    <!-- Highlighted: this is what TICKET-8 adds, a gate before any AI step -->
    <rect x="160" y="116" width="320" height="56" rx="10" fill="#E3F1EC" stroke="#0F6E5C" stroke-width="2.6"/>
    <text x="320" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4438">Hide names &amp; account numbers</text>
    <text x="320" y="162" text-anchor="middle" font-size="11" font-weight="600" fill="#0B4438">&#8592; TICKET-8 adds this gate</text>
    <line x1="320" y1="172" x2="320" y2="202" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>

    <!-- Everything below: muted, not built by this task -->
    
    <rect x="180" y="208" width="280" height="56" rx="10" fill="#EDEDEA" stroke="#C7C4BA" stroke-width="1.4"/>
    <text x="320" y="242" text-anchor="middle" font-size="16" font-weight="600" fill="#9C9A90">Look up the real rulebook</text>
    <line x1="320" y1="264" x2="320" y2="294" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>

    
    <rect x="180" y="300" width="280" height="56" rx="10" fill="#EDEDEA" stroke="#C7C4BA" stroke-width="1.4"/>
    <text x="320" y="334" text-anchor="middle" font-size="16" font-weight="600" fill="#9C9A90">Figure out why it's stuck</text>
    <line x1="320" y1="356" x2="320" y2="386" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>

    <rect x="180" y="392" width="280" height="56" rx="10" fill="#EDEDEA" stroke="#C7C4BA" stroke-width="1.4"/>
    <text x="320" y="426" text-anchor="middle" font-size="14.5" font-weight="600" fill="#9C9A90">Check the rules &amp; watch lists</text>
    <line x1="320" y1="448" x2="320" y2="476" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>

    <polygon points="320,476 420,524 320,572 220,524" fill="#EDEDEA" stroke="#C7C4BA" stroke-width="1.4"/>
    <text x="320" y="530" text-anchor="middle" font-size="15" font-weight="700" fill="#9C9A90">Decide</text>

    <line x1="220" y1="524" x2="126" y2="648" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
    <line x1="320" y1="572" x2="320" y2="648" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
    <line x1="420" y1="524" x2="514" y2="648" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>

    <rect x="30" y="652" width="180" height="56" rx="10" fill="#EDEDEA" stroke="#C7C4BA" stroke-width="1.4"/>
    <text x="120" y="686" text-anchor="middle" font-size="14.5" font-weight="600" fill="#9C9A90">Let it through</text>

    <rect x="230" y="652" width="180" height="56" rx="10" fill="#EDEDEA" stroke="#C7C4BA" stroke-width="1.4"/>
    <text x="320" y="686" text-anchor="middle" font-size="14.5" font-weight="600" fill="#9C9A90">Block it</text>

    <rect x="430" y="652" width="180" height="56" rx="10" fill="#EDEDEA" stroke="#C7C4BA" stroke-width="1.4"/>
    <text x="520" y="686" text-anchor="middle" font-size="14.5" font-weight="600" fill="#9C9A90">Hand to a human</text>

    <line x1="120" y1="708" x2="245" y2="748" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
    <line x1="320" y1="708" x2="320" y2="748" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
    <line x1="520" y1="708" x2="395" y2="748" stroke="#C7C4BA" stroke-width="1.8" marker-end="url(#arrow-muted)"/>

    <rect x="170" y="752" width="300" height="56" rx="10" fill="#EDEDEA" stroke="#C7C4BA" stroke-width="1.4"/>
    <text x="320" y="786" text-anchor="middle" font-size="16" font-weight="600" fill="#9C9A90">Write a plain-English report</text>

  </g>
</svg>
