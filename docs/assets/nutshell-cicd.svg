<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Code changes go to a small helper that writes basic tests, which then run automatically. This is separate from the payment process.">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C8E8C"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="632" height="152" rx="18" fill="#F6F5F2" stroke="#E1DED6" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="24" y="52" width="170" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="109" y="86" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1B2A2E">Code changes</text>

    <line x1="194" y1="80" x2="232" y2="80" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow2)"/>

    <rect x="236" y="52" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="331" y="86" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1B2A2E">Helper writes tests</text>

    <line x1="426" y1="80" x2="456" y2="80" stroke="#7C8E8C" stroke-width="1.8" marker-end="url(#arrow2)"/>

    <rect x="460" y="52" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#9AACA9" stroke-width="1.6"/>
    <text x="540" y="78" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B2A2E">Tests run</text>
    <text x="540" y="94" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B2A2E">automatically</text>
  </g>
</svg>
